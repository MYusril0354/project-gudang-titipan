<style>
*{box-sizing:border-box}
:root{
  --bg:#f4f5f9;--panel:#fff;--ink:#1b2136;--muted:#6b7280;--line:#e5e7f0;
  --brand:#4f46e5;--brand2:#6366f1;--brand-soft:#eef1ff;
  --green:#0e7a55;--green-soft:#e6f6ef;
  --amber:#96620a;--amber-soft:#fdf3d6;
  --red:#b42318;--red-soft:#fee9e7;
  --blue:#1d4ed8;--blue-soft:#e6edff;
  --gray-soft:#eef0f5;
  --radius:14px;--shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
}
html,body{height:100%}
body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial;background:var(--bg);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased}
.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
.sidebar{background:#141a2e;color:#c7cbe0;display:flex;flex-direction:column;padding:18px 14px;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:12px;align-items:center;padding:4px 6px 22px}
.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#6366f1,#8b5cf6);display:grid;place-items:center;font-weight:800;color:#fff;font-size:13px;letter-spacing:.5px}
.brand-title{color:#fff;font-weight:650;font-size:13.5px}
.brand-sub{font-size:11px;color:#7f87a8;margin-top:1px}
#nav{display:flex;flex-direction:column;gap:4px}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;cursor:pointer;font-size:13.5px;color:#a9b0cc;border:none;background:none;width:100%;text-align:left;font-family:inherit;transition:.15s}
.nav-item:hover{background:#1c2440;color:#e7e9f5}
.nav-item.active{background:#252f52;color:#fff;box-shadow:inset 3px 0 0 #6366f1}
.nav-item svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nav-badge{margin-left:auto;background:#ef4444;color:#fff;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:999px}
.sidebar-foot{margin-top:auto;padding:14px 10px;border-top:1px solid #232b47;font-size:11.5px;color:#7f87a8}
.sidebar-foot b{display:block;color:#dfe3f2;font-size:12.5px;margin-top:2px}
.main{display:flex;flex-direction:column;min-width:0}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:18px 28px;background:rgba(255,255,255,.85);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.topbar h1{font-size:19px;margin:0;font-weight:680;letter-spacing:-.2px}
.topbar p{margin:3px 0 0;font-size:12.5px;color:var(--muted)}
.topbar-right{display:flex;align-items:center;gap:12px}
.pill{background:var(--brand-soft);color:var(--brand);font-size:11.5px;font-weight:650;padding:5px 11px;border-radius:999px}
.avatar{width:34px;height:34px;border-radius:50%;background:#e2e5f5;color:#3b4270;display:grid;place-items:center;font-weight:700;font-size:12px}
.view{padding:22px 28px 70px;display:flex;flex-direction:column;gap:18px}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
@media(max-width:1180px){.cards{grid-template-columns:repeat(2,1fr)}}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.stat::after{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--accent,var(--brand))}
.stat-label{font-size:11.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.stat-value{font-size:26px;font-weight:750;margin-top:8px;letter-spacing:-.6px;line-height:1.1}
.stat-value small{font-size:13px;font-weight:600;color:var(--muted);margin-left:5px;letter-spacing:0}
.stat-foot{margin-top:8px;font-size:12px;color:var(--muted)}
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:15px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-title{font-weight:680;font-size:14px}
.panel-sub{font-size:12px;color:var(--muted);margin-top:2px}
.panel-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.panel-body{padding:0}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:#8a90a6;font-weight:700;padding:10px 14px;border-bottom:1px solid var(--line);background:#fafbfe;white-space:nowrap}
.tbl td{padding:11px 14px;border-bottom:1px solid #f0f1f7;vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr:hover td{background:#fbfcff}
.num{text-align:right;font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.sub{font-size:11.5px;color:var(--muted);margin-top:2px}
.kode{display:inline-block;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:6px;background:#eef1ff;color:#4f46e5}
.rak{display:inline-flex;align-items:center;gap:4px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:6px;background:#f0f7ff;color:#1d4ed8;border:1px solid #d5e3f7}
.sjtag{display:inline-flex;align-items:center;gap:4px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;background:#fef8e6;color:#8a5a00;border:1px solid #f0d99e}
.batchtag{display:inline-flex;align-items:center;gap:4px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;background:#f0fdf4;color:#166534;border:1px solid #bbf7d0}
.print-badge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:999px;background:#f3f4f8;color:#6b7280}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:680;padding:3px 9px;border-radius:999px;white-space:nowrap}
.b-gray{background:var(--gray-soft);color:#4b5563}
.b-amber{background:var(--amber-soft);color:var(--amber)}
.b-green{background:var(--green-soft);color:var(--green)}
.b-blue{background:var(--blue-soft);color:var(--blue)}
.b-red{background:var(--red-soft);color:var(--red)}
.b-purple{background:var(--brand-soft);color:var(--brand)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:7px 12px;border-radius:9px;font-size:12.5px;font-weight:650;cursor:pointer;font-family:inherit;transition:.15s;white-space:nowrap}
.btn:hover{border-color:#c9cde0;background:#fafbff}
.btn-primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn-primary:hover{background:#4338ca;border-color:#4338ca}
.btn-ok{background:#0e9f6e;border-color:#0e9f6e;color:#fff}
.btn-ok:hover{background:#0b8a5f;border-color:#0b8a5f}
.btn-warn{background:#fff;border-color:#f0d59a;color:#92620a}
.btn-warn:hover{background:#fffaef}
.btn-danger{background:#fff;border-color:#f3c0bb;color:#b42318}
.btn-danger:hover{background:#fff5f4}
.btn-sm{padding:5px 10px;font-size:11.5px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-group{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.input{padding:8px 12px;border:1px solid var(--line);border-radius:9px;font-size:13px;font-family:inherit;background:#fff;color:var(--ink);outline:none;min-width:220px}
.input:focus{border-color:var(--brand2);box-shadow:0 0 0 3px rgba(99,102,241,.15)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 18px;background:#fff;flex-wrap:wrap}
.tab{padding:12px 16px;cursor:pointer;font-size:13px;font-weight:650;color:var(--muted);border:none;background:none;border-bottom:2px solid transparent;margin-bottom:-1px;font-family:inherit;transition:.15s}
.tab.active{color:var(--brand);border-bottom-color:var(--brand)}
.tab:hover{color:var(--ink)}
.tab .count{background:var(--gray-soft);color:#4b5563;padding:1px 7px;border-radius:999px;font-size:11px;margin-left:6px;font-weight:700}
.tab.active .count{background:var(--brand-soft);color:var(--brand)}
.empty{padding:44px 20px;text-align:center;color:var(--muted);font-size:13px}
.empty b{display:block;color:var(--ink);font-size:14px;margin-bottom:4px}
.callout{display:flex;gap:12px;padding:14px 16px;border-radius:12px;font-size:12.5px;line-height:1.55;border:1px solid}
.callout-amber{background:#fffaf0;border-color:#f3e0b0;color:#6d4c06}
.callout-blue{background:#f5f8ff;border-color:#d5e0fb;color:#28406f}

.sj-card{border:1px solid var(--line);border-radius:13px;background:#fff;box-shadow:var(--shadow);overflow:hidden}
.sj-head{display:flex;justify-content:space-between;gap:16px;padding:14px 18px;background:#fafbff;border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:center}
.sj-no{font-weight:700;font-size:14px;letter-spacing:-.2px}
.sj-meta{font-size:12px;color:var(--muted);margin-top:3px;display:flex;gap:14px;flex-wrap:wrap}
.sj-meta span b{color:#3c4358;font-weight:650}
.modal-backdrop{position:fixed;inset:0;background:rgba(16,21,38,.55);display:grid;place-items:center;padding:20px;z-index:100;animation:fade .15s}
.modal{background:#fff;border-radius:16px;width:100%;max-width:680px;box-shadow:0 24px 60px rgba(16,21,38,.3);animation:pop .18s ease-out;max-height:92vh;display:flex;flex-direction:column}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.modal-head h3{margin:0;font-size:16px;font-weight:700}
.modal-head p{margin:3px 0 0;font-size:12.5px;color:var(--muted)}
.modal-body{padding:20px 22px;overflow:auto}
.modal-foot{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;background:#fbfcff;border-radius:0 0 16px 16px;flex-wrap:wrap}
.x{background:none;border:none;font-size:20px;line-height:1;color:#9aa0b5;cursor:pointer;padding:2px 6px;border-radius:6px}
.x:hover{background:#f0f1f7;color:#444}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:680;color:#4b5563;margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;font-size:13.5px;font-family:inherit;background:#fff;color:var(--ink);outline:none;transition:.15s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand2);box-shadow:0 0 0 3px rgba(99,102,241,.15)}
.field textarea{resize:vertical;min-height:64px}
.hint{font-size:11.5px;color:var(--muted);margin-top:5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.infobox{background:#f8f9fe;border:1px solid var(--line);border-radius:11px;padding:13px 15px;margin-bottom:16px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px 16px;font-size:13px}
.infobox .k{display:block;color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;font-weight:700;margin-bottom:3px}
.infobox b{font-weight:700}
.addline-box{background:#f8f9fe;border:1px solid var(--line);border-radius:11px;padding:14px;margin-bottom:16px}
.addline-title{font-size:11.5px;font-weight:700;color:#4b5563;text-transform:uppercase;letter-spacing:.4px;margin-bottom:10px}
.inline-input{padding:6px 8px;border:1px solid var(--line);border-radius:6px;font-family:inherit;font-size:12.5px;background:#fff;color:var(--ink);outline:none;width:100%}
.inline-input:focus{border-color:var(--brand2);box-shadow:0 0 0 3px rgba(99,102,241,.15)}
.ks-form{padding:16px 18px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
@media(max-width:900px){.ks-form{grid-template-columns:1fr 1fr}}
.ks-tbl tbody tr.batch-start td{border-top:2px solid #cbd5e1}
.ks-tbl tbody tr.batch-start:first-child td{border-top:none}
.ks-tbl tbody tr.batch-start:hover td{background:#eef1fb}
.ks-tbl td.balance-final{background:#f7f9ff;font-weight:750}
.ks-tbl .saldo-cell{font-variant-numeric:tabular-nums;font-weight:700}
.ks-tbl .in-cell{color:#0e7a55;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.ks-tbl .out-cell{color:#b42318;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.ref-type{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.4px;padding:1px 6px;border-radius:4px;margin-top:3px}
.ref-in{background:#e6f6ef;color:#0e7a55}
.ref-out{background:#e6edff;color:#1d4ed8}
#toastRoot{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:10px;z-index:200}
.toast{background:#141a2e;color:#fff;padding:12px 16px;border-radius:11px;font-size:13px;box-shadow:0 10px 30px rgba(16,21,38,.32);animation:slide .22s;max-width:360px;line-height:1.45}
.toast.ok{border-left:3px solid #10b981}
.toast.warn{border-left:3px solid #f59e0b}
.toast.err{border-left:3px solid #ef4444}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
@keyframes slide{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
</style>
</head>

/* =========================================================
   3. KOMPUTASI SJ LINE
   ========================================================= */
const qtyReceived = (l) => (l.receipts || []).reduce((a,r) => a + r.qty, 0);
const pendingOf   = (l) => l.qtySj - qtyReceived(l) - l.qtyCancelled;

function lineStatus(l){
  const pending = pendingOf(l);
  if (pending <= 0) return l.qtyCancelled >= l.qtySj ? 'CANCELLED' : 'RECEIVED';
  if (qtyReceived(l) > 0) return 'PARTIALLY_RECEIVED';
  if (l.decision === 'WAITING') return 'WAITING_PHYSICAL';
  return 'OPEN';
}
const STATUS_META = {
  OPEN:               { label:'Belum diklasifikasi', cls:'b-gray'  },
  WAITING_PHYSICAL:   { label:'Fisik belum ada',     cls:'b-amber' },
  PARTIALLY_RECEIVED: { label:'Diterima sebagian',   cls:'b-blue'  },
  RECEIVED:           { label:'Diterima',            cls:'b-green' },
  CANCELLED:          { label:'Dibatalkan',          cls:'b-red'   },
};
function badge(status){
  const m = STATUS_META[status] || STATUS_META.OPEN;
  return `<span class="badge ${m.cls}">${m.label}</span>`;
}
function sjStatus(s){
  const st = s.lines.map(lineStatus);
  if (st.every(x => x === 'RECEIVED' || x === 'CANCELLED')) return 'RECEIVED';
  if (st.some(x => x === 'WAITING_PHYSICAL' || x === 'PARTIALLY_RECEIVED')) return 'WAITING_PHYSICAL';
  return 'OPEN';
}
function allPending(){
  const rows = [];
  db.sj.forEach(s => s.lines.forEach(l => {
    const st = lineStatus(l);
    if (st === 'WAITING_PHYSICAL' || st === 'PARTIALLY_RECEIVED') {
      rows.push({ sj:s, line:l, status:st, pending:pendingOf(l), umur: aging(s.date) });
    }
  }));
  return rows.sort((a,b) => b.umur - a.umur);
}
function allOpen(){
  const rows = [];
  db.sj.forEach(s => s.lines.forEach(l => {
    if (lineStatus(l) === 'OPEN') rows.push({ sj:s, line:l, pending:pendingOf(l) });
  }));
  return rows;
}

/* =========================================================
   4. BATCH LEDGER
   ========================================================= */
function buildBatches(){
  const batches = [];
  db.sj.forEach(s => s.lines.forEach(l => {
    (l.receipts || []).forEach((r, idx) => {
      batches.push({
        id: s.no + '|' + l.id + '|' + idx,
        sjNo: s.no, sjDate: s.date, po: s.po,
        product: l.product, rackId: r.rackId, customer: s.customer,
        batchNumber: r.batchNumber || '—',
        qtyIn: r.qty, dateIn: r.date, pic: r.pic
      });
    });
  }));
  return batches;
}
function initConsumption(){
  const batches = buildBatches();
  const consumed = {};
  db.shipments.forEach(sh => sh.lines.forEach(l => { l.consumed = []; }));
  const sorted = [...db.shipments].sort((a,b) => a.date.localeCompare(b.date));
  sorted.forEach(sh => {
    if (sh.status === 'DRAFT') return;
    sh.lines.forEach(l => {
      let remaining = l.qty;
      const candidates = batches
        .filter(b => b.product === l.product && b.rackId === l.rackId
                  && b.customer === sh.customer && b.dateIn <= sh.date)
        .sort((a,b) => a.dateIn.localeCompare(b.dateIn) || a.id.localeCompare(b.id));
      for (const b of candidates) {
        if (remaining <= 0) break;
        const used = consumed[b.id] || 0;
        const avail = b.qtyIn - used;
        if (avail <= 0) continue;
        const take = Math.min(remaining, avail);
        l.consumed.push({ batchId: b.id, sjNo: b.sjNo, batchNumber: b.batchNumber, qty: take });
        consumed[b.id] = used + take;
        remaining -= take;
      }
    });
  });
}
function stockByBatch(){
  const batches = buildBatches();
  const consumed = {};
  db.shipments.forEach(sh => {
    if (sh.status === 'DRAFT') return;
    (sh.lines || []).forEach(l => { (l.consumed || []).forEach(c => { consumed[c.batchId] = (consumed[c.batchId] || 0) + c.qty; }); });
  });
  return batches.map(b => ({ ...b, qtyOut: consumed[b.id] || 0, qtyAvail: b.qtyIn - (consumed[b.id] || 0) })).filter(b => b.qtyAvail > 0);
}
function getAvailableBatchesForCustomer(cid){ return stockByBatch().filter(b => b.customer === cid); }
function stockRows(){
  return stockByBatch().map(b => {
    const r = rack(b.rackId);
    return {
      batchId: b.id, sjNo: b.sjNo, sjDate: b.sjDate, batchNumber: b.batchNumber,
      product: b.product, rack: r, location: loc(r.locationId),
      customer: b.customer, qty: b.qtyAvail, lastIn: b.dateIn
    };
  }).sort((a,b) => {
    const ca = cust(a.customer).name, cb = cust(b.customer).name;
    if (ca !== cb) return ca.localeCompare(cb);
    if (a.sjNo !== b.sjNo) return a.sjNo.localeCompare(b.sjNo);
    return a.product.localeCompare(b.product);
  });
}
const movements = [];
function initMovements(){
  movements.length = 0;
  db.sj.forEach(s => s.lines.forEach(l => {
    (l.receipts || []).forEach(r => movements.push({
      date: r.date, type:'CONSIGN_IN', ref: s.no, product: l.product,
      customer: s.customer, rackId: r.rackId, qty: r.qty,
      batchNumber: r.batchNumber || '—', note: 'Penerimaan fisik', sjRef: s.no
    }));
  }));
  db.shipments.forEach(sh => {
    if (sh.status === 'DRAFT') return;
    sh.lines.forEach(l => {
      const sjRefs = (l.consumed || []).map(c => c.sjNo).join(', ');
      const batchRefs = (l.consumed || []).map(c => c.batchNumber).join(', ');
      movements.push({
        date: sh.date, type:'CONSIGN_OUT', ref: sh.no, product: l.product,
        customer: sh.customer, rackId: l.rackId, qty: -l.qty,
        batchNumber: batchRefs || '—', note: 'Pengiriman', sjRef: sjRefs
      });
    });
  });
  movements.sort((a,b) => a.date < b.date ? 1 : -1);
}

/* =========================================================
   5. KARTU STOCK BUILDER
   ========================================================= */
function buildKartuStockEntries(filter){
  const code = (filter.code || '').trim().toLowerCase();
  const batch = (filter.batch || '').trim().toLowerCase();
  const customer = filter.customer || '';
  const fromDate = filter.from || '';
  const toDate = filter.to || '';
  const all = [];

  db.sj.forEach(s => {
    if (customer && s.customer !== customer) return;
    s.lines.forEach(l => {
      const p = prod(l.product);
      if (code && !p.code.toLowerCase().includes(code)) return;
      (l.receipts || []).forEach(r => {
        const bn = r.batchNumber || '—';
        if (batch && !bn.toLowerCase().includes(batch)) return;
        if (fromDate && r.date < fromDate) return;
        if (toDate && r.date > toDate) return;
        all.push({
          date: r.date, type:'IN', ref: s.no,
          product: l.product, customer: s.customer,
          batchNumber: bn, rackId: r.rackId,
          in: r.qty, out: 0, note: 'Penerimaan fisik'
        });
      });
    });
  });
  db.shipments.forEach(sh => {
    if (sh.status === 'DRAFT') return;
    if (customer && sh.customer !== customer) return;
    sh.lines.forEach(l => {
      const p = prod(l.product);
      if (code && !p.code.toLowerCase().includes(code)) return;
      (l.consumed || []).forEach(c => {
        const bn = c.batchNumber || '—';
        if (batch && !bn.toLowerCase().includes(batch)) return;
        if (fromDate && sh.date < fromDate) return;
        if (toDate && sh.date > toDate) return;
        all.push({
          date: sh.date, type:'OUT', ref: sh.no,
          product: l.product, customer: sh.customer,
          batchNumber: bn, rackId: l.rackId,
          in: 0, out: c.qty, note: 'Pengiriman'
        });
      });
    });
  });

  const groups = {};
  all.forEach(e => {
    const k = e.customer + '|' + e.product + '|' + e.batchNumber;
    if (!groups[k]) groups[k] = [];
    groups[k].push(e);
  });
  const result = [];
  Object.values(groups).forEach(arr => {
    arr.sort((a,b) => {
      if (a.date !== b.date) return a.date < b.date ? -1 : 1;
      if (a.type !== b.type) return a.type === 'IN' ? -1 : 1;
      return 0;
    });
    let bal = 0;
    arr.forEach((e, idx) => {
      bal += e.in - e.out;
      e.balance = bal;
      e.isGroupEnd = idx === arr.length - 1;
      result.push(e);
    });
  });
  result.sort((a,b) => {
    const ca = cust(a.customer).name, cb = cust(b.customer).name;
    if (ca !== cb) return ca.localeCompare(cb);
    const pa = prod(a.product).code, pb = prod(b.product).code;
    if (pa !== pb) return pa.localeCompare(pb);
    if (a.batchNumber !== b.batchNumber) return a.batchNumber.localeCompare(b.batchNumber);
    return a.date.localeCompare(b.date);
  });
  return result;
}

        </div>`;
      } else if (status === 'WAITING_PHYSICAL') {
        actions = `<div class="btn-group">
          <button class="btn btn-sm btn-ok" onclick="openReceive('${s.no}','${l.id}')">Fisik Ada</button>
          <button class="btn btn-sm btn-danger" onclick="openCancel('${s.no}','${l.id}')">Batalkan</button>
        </div>`;
      } else if (status === 'PARTIALLY_RECEIVED') {
        actions = `<div class="btn-group">
          <button class="btn btn-sm btn-ok" onclick="openReceive('${s.no}','${l.id}')">Fisik Ada</button>
          <button class="btn btn-sm btn-danger" onclick="openCancel('${s.no}','${l.id}')">Batalkan sisa</button>
        </div>`;
      } else { actions = `<span class="sub">—</span>`; }
      const info = status === 'WAITING_PHYSICAL' || status === 'PARTIALLY_RECEIVED'
        ? `<div class="sub">${ALASAN[l.alasan] || '—'} • ETA ${fmtDate(l.eta)} • PIC ${l.pic || '—'}</div>` : '';
      const rackList = (l.receipts || []).map(r =>
        `<div class="sub" style="margin-top:4px">${batchTag(r.batchNumber || '—')} ${rakTag(rack(r.rackId).code)} ${fmt(r.qty)} ${p.unit} • ${fmtDate(r.date)}</div>`
      ).join('');
      return `<tr>
        <td><div><b>${p.name}</b></div><div class="sub">${kodeTag(p.code)}</div></td>
        <td class="num">${fmt(l.qtySj)} <span class="sub">${p.unit}</span></td>
        <td class="num">${fmt(received)}${rackList}</td>
        <td class="num"><b>${fmt(pending)}</b></td>
        <td>${badge(status)}${info}</td>
        <td class="num">${actions}</td>
      </tr>`;
    }).join('');
    return `<div class="sj-card">
      <div class="sj-head">
        <div>
          <div class="sj-no">${s.no}</div>
          <div class="sj-meta">
            <span>Tanggal <b>${fmtDate(s.date)}</b></span>
            <span>Pelanggan <b>${cust(s.customer).name}</b></span>
            <span>PO <b>${s.po}</b></span>
          </div>
        </div>
        <div>${badge(st)}</div>
      </div>
      <table class="tbl">
        <thead><tr><th>Produk / Kode</th><th class="num">Qty SJ</th><th class="num">Diterima & Batch & Rak</th>
          <th class="num">Pending</th><th>Status</th><th class="num">Aksi</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
  }).join('');
  return `
    <div class="callout callout-blue">
      <div>ℹ️</div>
      <div><b>Alur:</b> tambah SJ sebagai dokumen masuk, lalu tiap <b>Fisik Ada</b> menciptakan <b>batch</b>
      dengan <b>Nomor Batch</b> yang mengalir ke stok, pengiriman, dan surat jalan.</div>
    </div>
    <div class="panel">
      <div class="panel-head">
        <div><div class="panel-title">Daftar Surat Jalan</div>
          <div class="panel-sub">${db.sj.length} SJ terdaftar</div></div>
        <div class="panel-actions">
          <input class="input" placeholder="Cari no SJ / pelanggan / PO…"
                 value="${ui.q}" oninput="ui.q=this.value;render()">
          <button class="btn btn-primary" onclick="openAddSJ()">+ Tambah Penerimaan SJ</button>
        </div>
      </div>
    </div>
    ${cards || `<div class="panel"><div class="empty"><b>Tidak ada surat jalan</b>Ubah kata kunci atau tambah SJ baru.</div></div>`}`;
}

/* =========================================================

    r.sj.no.toLowerCase().includes(q) || cust(r.sj.customer).name.toLowerCase().includes(q) ||
    prod(r.line.product).name.toLowerCase().includes(q) || prod(r.line.product).code.toLowerCase().includes(q));
  const totalQty = rows.reduce((a,r) => a + r.pending, 0);
  const bucket = (min, max) => rows.filter(r => r.umur >= min && r.umur <= max).length;

  const body = rows.map(r => {
    const p = prod(r.line.product);
    return `<tr>
      <td><div class="mono">${r.sj.no}</div><div class="sub">${fmtDate(r.sj.date)}</div></td>
      <td><b>${cust(r.sj.customer).name}</b></td>

  return `

        <div><div class="panel-title">Antrean Penerimaan Fisik</div>

        <div class="panel-actions">

      <div class="panel-body">
        ${rows.length ? `<table class="tbl">
          <thead><tr><th>Surat Jalan</th><th>Pelanggan</th><th>Produk</th>

            return `<tr>

/* =========================================================
   12. HALAMAN: STOK (urutan kolom baru, nama rak dihapus)

function renderStok(){
  const q = ui.qStok.toLowerCase();
  let rows = stockRows();
  if (q) rows = rows.filter(r =>
    cust(r.customer).name.toLowerCase().includes(q) ||
    prod(r.product).name.toLowerCase().includes(q) ||
    prod(r.product).code.toLowerCase().includes(q) ||
    r.rack.code.toLowerCase().includes(q) ||
    r.sjNo.toLowerCase().includes(q) ||
    r.batchNumber.toLowerCase().includes(q));

  const total = rows.reduce((a,r) => a + r.qty, 0);
  const perCustomer = {};
  rows.forEach(r => { perCustomer[r.customer] = (perCustomer[r.customer] || 0) + r.qty; });
  const rackCount = new Set(rows.map(r => r.rack.id)).size;
  const sjCount = new Set(rows.map(r => r.sjNo)).size;

  const body = rows.map(r => {
    const p = prod(r.product);
    return `<tr>
      <td><b>${cust(r.customer).name}</b></td>
      <td>${sjTag(r.sjNo)}<div class="sub">${fmtDate(r.sjDate)}</div></td>
      <td>${kodeTag(p.code)}</td>
      <td>${p.name}</td>
      <td>${batchTag(r.batchNumber)}</td>
      <td>${rakTag(r.rack.code)}</td>
      <td class="num"><b>${fmt(r.qty)}</b></td>
      <td>${p.unit}</td>
      <td>${r.lastIn ? umurBadge(aging(r.lastIn)) : '—'}</td>

  const summary = Object.keys(perCustomer).map(cid => `
    <tr>
      <td>${cust(cid).name}</td>

      <td class="num">${rows.filter(r => r.customer === cid).length} batch</td>

  return `
    <div class="cards">
      ${statCard('Total Stok Titipan', fmt(total), 'unit', `${rows.length} batch`, '#4f46e5')}
      ${statCard('SJ dengan Stok', fmt(sjCount), 'SJ', 'Dokumen sumber aktif', '#2563eb')}
      ${statCard('Rak Terpakai', fmt(rackCount), 'rak', 'Lokasi penyimpanan fisik', '#0e9f6e')}
      ${statCard('Belum POD', fmt(db.shipments.filter(s => s.status === 'SHIPPED').length), 'DO', 'Bukti terima belum masuk', '#d97706')}
    </div>
    <div class="panel">
      <div class="panel-head"><div class="panel-title">Ringkasan per Pelanggan</div></div>
      <div class="panel-body">
        <table class="tbl">
          <thead><tr><th>Pelanggan</th><th class="num">Qty Titipan</th><th class="num">Batch</th></tr></thead>
          <tbody>${summary || '<tr><td colspan="3" class="empty">Belum ada stok titipan.</td></tr>'}</tbody>
        </table>
      </div>
    </div>
    <div class="panel">
      <div class="panel-head">
        <div><div class="panel-title">Posisi Stok per Batch</div>
          <div class="panel-sub">Setiap baris = satu batch penerimaan dengan nomor batch unik</div></div>
        <div class="panel-actions">
          <input class="input" placeholder="Cari batch / SJ / produk / rak…"
                 value="${ui.qStok}" oninput="ui.qStok=this.value;render()">

      <div class="panel-body">
        ${rows.length ? `<table class="tbl">
          <thead><tr>
            <th>Pelanggan</th>
            <th>SJ Asal</th>
            <th>Kode Produk</th>
            <th>Nama Produk</th>
            <th>Batch</th>
            <th>Lokasi Rak</th>
            <th class="num">Qty</th>
            <th>Satuan</th>
            <th>Umur</th>
          </tr></thead>

      </div>
    </div>`;
}

function renderPengiriman(){
  const rows = db.shipments.slice().sort((a,b) => a.date < b.date ? 1 : -1);
  const body = rows.map(sh => {
    const qty = sh.lines.reduce((a,l) => a + l.qty, 0);
    const stBadge = sh.status === 'DELIVERED'
      ? '<span class="badge b-green">Terkirim + POD</span>'
      : sh.status === 'SHIPPED'
        ? '<span class="badge b-blue">Sudah keluar</span>'
        : '<span class="badge b-gray">Draft</span>';
    const lines = sh.lines.map(l => {
      const p = prod(l.product);
      const sjRefs = (l.consumed || []).map(c => c.sjNo).filter(Boolean).join(', ');
      const batchRefs = (l.consumed || []).map(c => c.batchNumber).filter(Boolean).join(', ');
      return `<div style="margin-bottom:6px">
        ${p.name} <span class="sub">${kodeTag(p.code)} ${rakTag(rack(l.rackId).code)} × ${fmt(l.qty)}</span>
        ${batchRefs ? `<div class="sub" style="margin-top:2px">${batchTag(batchRefs)}</div>` : ''}
        ${sjRefs ? `<div class="sub" style="margin-top:2px">dari ${sjTag(sjRefs)}</div>` : ''}
      </div>`;
    }).join('');
    return `<tr>
      <td><div class="mono">${sh.no}</div>${printBadge(sh)}</td>
      <td>${fmtDate(sh.date)}</td>
      <td><b>${cust(sh.customer).name}</b></td>
      <td>${lines}</td>
      <td class="num"><b>${fmt(qty)}</b></td>
      <td>${stBadge}</td>
      <td>${sh.pod ? fmtDate(sh.pod) : '<span class="sub">—</span>'}</td>
      <td class="num"><button class="btn btn-sm btn-primary" onclick="printSuratJalan('${sh.no}')">🖨 Cetak SJ</button></td>
    </tr>`;
  }).join('');

  return `
    <div class="cards">
      ${statCard('Total Pengiriman', fmt(db.shipments.length), 'DO', 'Semua status', '#4f46e5')}
      ${statCard('Sudah Dikirim', fmt(db.shipments.filter(s => s.status !== 'DRAFT').length), 'DO', 'Stok sudah keluar', '#0e9f6e')}
      ${statCard('Draft', fmt(db.shipments.filter(s => s.status === 'DRAFT').length), 'DO', 'Belum memotong stok', '#6b7280')}
      ${statCard('Sudah Dicetak', fmt(db.shipments.filter(s => s.printCount > 0).length), 'DO', 'Surat jalan pernah dicetak', '#2563eb')}
    </div>
    <div class="callout callout-blue">
      <div>🖨️</div>
      <div><b>Cetak Surat Jalan</b> menampilkan <b>No. Batch</b> dan <b>SJ Asal</b> per baris.</div>
    </div>
    <div class="panel">
      <div class="panel-head">
        <div><div class="panel-title">Daftar Pengiriman</div>
          <div class="panel-sub">Outbound dari gudang titipan</div></div>
        <div class="panel-actions">
          <button class="btn btn-primary" onclick="openShipment()">+ Buat Pengiriman</button>
        </div>
      </div>
      <div class="panel-body">
        <table class="tbl">
          <thead><tr><th>No DO</th><th>Tanggal</th><th>Pelanggan</th><th>Produk / Batch / SJ Asal</th>
            <th class="num">Qty</th><th>Status</th><th>POD</th><th class="num">Aksi</th></tr></thead>
          <tbody>${body || '<tr><td colspan="8" class="empty">Belum ada pengiriman.</td></tr>'}</tbody>
        </table>
      </div>
    </div>`;
}

  return `

function renderKartuFilterForm(){

  return `
    <div class="ks-form">
      <div class="field" style="margin:0">
        <label>Kode Produk</label>

        <label>Pelanggan</label>

      </div>

        <label>&nbsp;</label>
        <button class="btn" style="width:100%" onclick="resetKartuFilter()">↺ Reset Filter</button>
      </div>
    </div>
  `;
}
function renderKartuResults(){
  const f = ui.kartuFilter;
  const entries = buildKartuStockEntries(f);
  const totalIn = entries.reduce((a,e) => a + e.in, 0);
  const totalOut = entries.reduce((a,e) => a + e.out, 0);
  const saldo = totalIn - totalOut;
  const groupSet = new Set(entries.map(e => e.customer + '|' + e.product + '|' + e.batchNumber));
  const hasFilter = !!(f.code || f.batch || f.customer || f.from || f.to);

  let lastKey = '';
  const rows = entries.map(e => {
    const p = prod(e.product);
    const r = rack(e.rackId);
    const key = e.customer + '|' + e.product + '|' + e.batchNumber;
    const isNewGroup = key !== lastKey;
    lastKey = key;
    const isLast = e.isGroupEnd;
    const saldoCls = isLast ? 'balance-final' : 'saldo-cell';

    return `<tr class="${isNewGroup ? 'batch-start' : ''}">
      <td>${fmtDate(e.date)}</td>
      <td>${cust(e.customer).name}</td>
      <td>
        <div class="mono">${e.ref}</div>
        <span class="ref-type ${e.type === 'IN' ? 'ref-in' : 'ref-out'}">${e.type === 'IN' ? 'MASUK' : 'KELUAR'}</span>
      </td>
      <td>${kodeTag(p.code)}</td>
      <td>${batchTag(e.batchNumber)}</td>
      <td>${rakTag(r.code)}</td>
      <td class="in-cell">${e.in ? '+' + fmt(e.in) : '—'}</td>
      <td class="out-cell">${e.out ? '−' + fmt(e.out) : '—'}</td>
      <td class="num ${saldoCls}">${fmt(e.balance)}</td>
    </tr>`;
  }).join('');

  const filterChips = [];
  if (f.code)     filterChips.push(`Kode: <b>${f.code}</b>`);
  if (f.batch)    filterChips.push(`Batch: <b>${f.batch}</b>`);
  if (f.customer) filterChips.push(`Pelanggan: <b>${cust(f.customer).name}</b>`);
  if (f.from)     filterChips.push(`Dari: <b>${fmtDate(f.from)}</b>`);
  if (f.to)       filterChips.push(`Sampai: <b>${fmtDate(f.to)}</b>`);

  return `
    <div class="cards">
      ${statCard('Total Masuk', fmt(totalIn), 'unit', hasFilter ? 'Sesuai filter' : 'Semua penerimaan', '#0e9f6e')}
      ${statCard('Total Keluar', fmt(totalOut), 'unit', hasFilter ? 'Sesuai filter' : 'Semua pengiriman', '#2563eb')}
      ${statCard('Saldo', fmt(saldo), 'unit', 'Masuk − keluar', '#4f46e5')}
      ${statCard('Batch Terlibat', fmt(groupSet.size), 'batch', hasFilter ? 'Hasil filter' : 'Semua batch', '#9333ea')}
    </div>
    <div class="panel">
      <div class="panel-head">
        <div>
          <div class="panel-title">Kartu Stock — Penelusuran Mutasi</div>
          <div class="panel-sub">${entries.length} mutasi ${hasFilter ? 'cocok filter' : 'tercatat'} • saldo berjalan per batch</div>
        </div>
        ${hasFilter ? `<div class="panel-actions">
          <span class="sub">${filterChips.join(' &nbsp;•&nbsp; ')}</span>
        </div>` : ''}
      </div>
      <div class="panel-body">
        ${entries.length ? `<table class="tbl ks-tbl">
          <thead><tr>
            <th>Tanggal</th>
            <th>Pelanggan</th>
            <th>Referensi</th>
            <th>Kode Produk</th>
            <th>Batch</th>
            <th>Rak</th>
            <th class="num">Masuk</th>
            <th class="num">Keluar</th>
            <th class="num">Saldo</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>` : `<div class="empty">
          <b>Tidak ada mutasi</b>
          ${hasFilter
            ? 'Tidak ada mutasi yang cocok dengan filter. Coba ubah atau <button class="btn btn-sm" style="margin-left:6px" onclick="resetKartuFilter()">Reset</button>'
            : 'Belum ada mutasi tercatat.'}
        </div>`}
      </div>
    </div>
  `;
}
function onKsInput(field, value){
  ui.kartuFilter[field] = value;
  const el = document.getElementById('ksResults');
  if (el) el.innerHTML = renderKartuResults();
}
function resetKartuFilter(){
  ui.kartuFilter = { code:'', batch:'', customer:'', from:'', to:'' };
  render();
}

/* =========================================================

function renderLaporan(){

  const totalPending = pending.reduce((a,r) => a + r.pending, 0);
  const totalMasuk = movements.filter(m => m.qty > 0).reduce((a,m) => a + m.qty, 0);
  const totalKeluar = movements.filter(m => m.qty < 0).reduce((a,m) => a + Math.abs(m.qty), 0);

  const exception = pending.map(r => {
    const p = prod(r.line.product);
    return `<tr>
      <td class="mono">${r.sj.no}</td>

      <td>${ALASAN[r.line.alasan] || '—'}</td>
    </tr>`;
  }).join('');

  const mutasi = movements.slice(0, 15).map(m => `
    <tr>
      <td>${fmtDate(m.date)}</td>
      <td>${m.type === 'CONSIGN_IN'
        ? '<span class="badge b-green">MASUK</span>'
        : '<span class="badge b-blue">KELUAR</span>'}</td>
      <td>
        <div class="mono">${m.ref}</div>
        ${m.sjRef && m.type === 'CONSIGN_OUT' ? `<div class="sub">dari ${sjTag(m.sjRef)}</div>` : ''}
      </td>
      <td>${m.batchNumber ? batchTag(m.batchNumber) : '—'}</td>
      <td>${cust(m.customer).name}</td>
      <td>${prod(m.product).name} <span class="sub">${kodeTag(prod(m.product).code)}</span></td>
      <td>${rakTag(rack(m.rackId).code)}</td>
      <td class="num"><b style="color:${m.qty > 0 ? '#0e7a55' : '#b42318'}">${m.qty > 0 ? '+' : ''}${fmt(m.qty)}</b></td>
    </tr>`).join('');

  return `
    <div class="cards">
      ${statCard('Total Masuk', fmt(totalMasuk), 'unit', 'Akumulasi penerimaan fisik', '#0e9f6e')}
      ${statCard('Total Keluar', fmt(totalKeluar), 'unit', 'Akumulasi pengiriman', '#2563eb')}
      ${statCard('Stok Titipan', fmt(totalStok), 'unit', 'Masuk − keluar', '#4f46e5')}
      ${statCard('Selisih Menggantung', fmt(totalPending), 'unit', 'Sudah potong stok existing', '#b42318')}
    </div>
    <div class="panel">
      <div class="panel-head">
        <div><div class="panel-title">Exception Report</div>
          <div class="panel-sub">SJ sudah potong stok existing, fisik belum diterima</div></div>
      </div>
      <div class="panel-body">
        ${pending.length ? `<table class="tbl">
          <thead><tr><th>Surat Jalan</th><th>Pelanggan</th><th>Produk / Kode</th>
            <th class="num">Qty Menggantung</th><th>Umur</th><th>Alasan</th></tr></thead>
          <tbody>${exception}</tbody>
        </table>` : `<div class="empty"><b>Tidak ada selisih</b></div>`}
      </div>
    </div>
    <div class="panel">
      <div class="panel-head">
        <div><div class="panel-title">Riwayat Mutasi</div>
          <div class="panel-sub">15 mutasi terakhir dengan batch & SJ referensi</div></div>
      </div>
      <div class="panel-body">
        <table class="tbl">
          <thead><tr><th>Tanggal</th><th>Tipe</th><th>Referensi</th><th>Batch</th><th>Pelanggan</th>
            <th>Produk</th><th>Rak</th><th class="num">Qty</th></tr></thead>
          <tbody>${mutasi || '<tr><td colspan="8" class="empty">Belum ada mutasi.</td></tr>'}</tbody>
        </table>
      </div>
    </div>`;
}

function renderMaster(){

    { id:'produk',    label:'Produk',    count: db.products.length },
    { id:'pelanggan', label:'Pelanggan', count: db.customers.length },

    { id:'rak',       label:'Rak',       count: db.racks.length },
  ];
  const tabsHtml = tabs.map(t =>
    `<button class="tab ${ui.masterTab === t.id ? 'active' : ''}" onclick="ui.masterTab='${t.id}';render()">
      ${t.label}<span class="count">${t.count}</span>
    </button>`).join('');
  let bodyHtml = '', addLabel = '', addFn = '';
  if (ui.masterTab === 'produk') {
    addLabel = '+ Tambah Produk'; addFn = 'openProduct()';
    bodyHtml = `<table class="tbl">
      <thead><tr><th>Kode Produk</th><th>Nama Produk</th><th>Satuan</th><th class="num">Aksi</th></tr></thead>

        <td>${kodeTag(p.code)}</td><td>${p.name}</td><td>${p.unit}</td>

  } else if (ui.masterTab === 'pelanggan') {

          <td class="sub">${c.address || '—'}</td>

            <button class="btn btn-sm btn-danger" onclick="delCustomer('${c.id}')">Hapus</button>
          </div></td></tr>`;}).join('')}</tbody></table>`;
  } else if (ui.masterTab === 'gudang') {
    addLabel = '+ Tambah Gudang'; addFn = 'openLocation()';
    bodyHtml = `<table class="tbl">
      <thead><tr><th>Tipe</th><th>Nama Gudang</th><th>Pelanggan</th><th class="num">Rak</th><th class="num">Aksi</th></tr></thead>
      <tbody>${db.locations.map(l => {
        const rc = db.racks.filter(r => r.locationId === l.id).length;
        return `<tr>
          <td>${l.type === 'MAIN' ? '<span class="badge b-purple">Utama</span>' : '<span class="badge b-blue">Titipan</span>'}</td>
          <td>${l.name}</td>
          <td>${l.customer ? cust(l.customer).name : '<span class="sub">—</span>'}</td>
          <td class="num">${rc}</td>
          <td class="num"><div class="btn-group">
            <button class="btn btn-sm" onclick="openLocation('${l.id}')">Edit</button>
            <button class="btn btn-sm btn-danger" onclick="delLocation('${l.id}')">Hapus</button>
          </div></td></tr>`;}).join('')}</tbody></table>`;

    bodyHtml = `<table class="tbl">
      <thead><tr><th>Kode Rak</th><th>Nama Rak</th><th>Gudang</th><th class="num">Aksi</th></tr></thead>

  return `

function openModal({ title, sub, body, footer }){
  $('modalRoot').innerHTML = `
    <div class="modal-backdrop" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <div class="modal-head">
          <div><h3>${title}</h3>${sub ? `<p>${sub}</p>` : ''}</div>
          <button class="x" onclick="closeModal()">×</button>
        </div>
        <div class="modal-body">${body}</div>
        <div class="modal-foot">${footer}</div>
      </div>
    </div>`;
}
function closeModal(){ $('modalRoot').innerHTML = ''; }
function findLine(sjNo, lineId){
  const s = db.sj.find(x => x.no === sjNo);
  const l = s && s.lines.find(x => x.id === lineId);
  return { s, l };
}

        <div class="addline-title">Baris Produk</div>

            <th class="num" style="width:30px">#</th><th>Produk</th>

  });
}
function updateSJLine(i, field, value){
  syncSJDraftFromDOM(); _sjDraft.lines[i][field] = value; updateAddSJModal();
}
function addSJLine(){
  syncSJDraftFromDOM(); _sjDraft.lines.push({ product: db.products[0]?.id || '', qty: 1 }); updateAddSJModal();
}
function removeSJLine(i){
  syncSJDraftFromDOM();
  if (_sjDraft.lines.length === 1) return;
  _sjDraft.lines.splice(i, 1); updateAddSJModal();
}
function submitAddSJ(){
  syncSJDraftFromDOM();
  const d = _sjDraft;
  if (!d.no.trim()) { toast('No SJ wajib diisi.', 'err'); return; }
  if (db.sj.find(s => s.no === d.no.trim())) { toast('No SJ sudah dipakai.', 'err'); return; }
  if (!d.date) { toast('Tanggal wajib.', 'err'); return; }
  if (!d.customer) { toast('Pilih pelanggan.', 'err'); return; }
  if (!d.po.trim()) { toast('No PO wajib diisi.', 'err'); return; }
  if (!d.lines.length) { toast('Minimal 1 baris produk.', 'err'); return; }
  if (d.lines.some(l => !l.product || !l.qty || l.qty < 1)) { toast('Setiap baris harus punya produk dan qty valid.', 'err'); return; }
  const lines = d.lines.map((ln, i) => ({
    id: `new${Date.now()}-${i}`, product: ln.product, qtySj: ln.qty,
    qtyCancelled: 0, decision: 'OPEN', receipts: []
  }));
  db.sj.unshift({ no: d.no.trim(), date: d.date, customer: d.customer, po: d.po.trim(), lines });
  toast(`Surat Jalan ${d.no.trim()} ditambahkan. Lakukan Fisik Ada untuk membuat batch.`, 'ok');
  closeModal(); render();
}

   19. MODAL: FISIK ADA
   ========================================================= */
function openReceive(sjNo, lineId){
  const { s, l } = findLine(sjNo, lineId);
  if (!s || !l) return;
  const p = prod(l.product);
  const pending = pendingOf(l);
  const racks = racksOfCustomer(s.customer);
  if (!racks.length) { toast('Pelanggan ini belum punya rak titipan. Tambahkan di Master Data.', 'err'); return; }
  const defaultBatch = suggestBatchNumber(TODAY);
  openModal({
    title: 'Konfirmasi Penerimaan Fisik',
    sub: 'Akan membuat batch dengan nomor batch yang terikat ke SJ ini',
    body: `
      <div class="infobox">
        <div><span class="k">Surat Jalan</span><b>${s.no}</b></div>
        <div><span class="k">Pelanggan</span><b>${cust(s.customer).name}</b></div>
        <div><span class="k">Produk</span><b>${p.name}</b></div>
        <div><span class="k">Kode Produk</span><b>${p.code}</b></div>
        <div><span class="k">Qty Pending</span><b style="color:#b45309">${fmt(pending)} ${p.unit}</b></div>
        <div><span class="k">Stok titipan</span><b>+${fmt(pending)} saat konfirmasi</b></div>
      </div>
      <form onsubmit="return submitReceive(event,'${s.no}','${l.id}')">
        <div class="grid2">
          <div class="field">
            <label>Qty diterima fisik</label>
            <input id="rcvQty" type="number" min="1" max="${pending}" value="${pending}" required>
            <div class="hint">Maks ${fmt(pending)} ${p.unit}. Boleh kurang untuk bertahap (batch berbeda).</div>
          </div>
          <div class="field">
            <label>Tanggal fisik</label>
            <input id="rcvDate" type="date" value="${TODAY}" required onchange="refreshBatchSuggestion()">
          </div>
        </div>
        <div class="field">
          <label>No. Batch</label>
          <input id="rcvBatch" type="text" value="${defaultBatch}" required>
          <div class="hint">Nomor batch/lot barang. Akan tampil di stok, kartu stock, pengiriman, dan surat jalan.</div>
        </div>
        <div class="grid2">
          <div class="field">
            <label>Lokasi rak tujuan</label>
            <select id="rcvRack" required>
              ${racks.map(r => `<option value="${r.id}">${r.code} — ${r.name}</option>`).join('')}
            </select>
          </div>
          <div class="field">
            <label>Kondisi</label>
            <select id="rcvCond"><option>Baik</option><option>Rusak sebagian</option></select>
          </div>
        </div>
        <div class="field">
          <label>Petugas penerima</label>
          <input id="rcvPic" type="text" value="Admin Gudang" required>
        </div>
      </form>`,
    footer: `
      <button class="btn" onclick="closeModal()">Batal</button>
      <button class="btn btn-ok" onclick="submitReceive(null,'${s.no}','${l.id}')">Konfirmasi Fisik Ada</button>`
  });
}
function refreshBatchSuggestion(){
  const date = $('rcvDate').value || TODAY;
  $('rcvBatch').value = suggestBatchNumber(date);
}
function submitReceive(ev, sjNo, lineId){
  if (ev) ev.preventDefault();
  const { s, l } = findLine(sjNo, lineId);
  const pending = pendingOf(l);
  const qty = parseInt($('rcvQty').value, 10);
  if (!qty || qty < 1 || qty > pending) { toast('Qty tidak valid.', 'err'); return false; }
  const date = $('rcvDate').value || TODAY;
  const rackId = $('rcvRack').value;
  const batchNumber = $('rcvBatch').value.trim();
  if (!batchNumber) { toast('No. Batch wajib diisi.', 'err'); return false; }
  l.receipts = l.receipts || [];
  l.receipts.push({ qty, rackId, date, pic: $('rcvPic').value, batchNumber });
  if (pendingOf(l) === 0) l.decision = 'DONE';
  movements.unshift({
    date, type:'CONSIGN_IN', ref: s.no, product: l.product,
    customer: s.customer, rackId, qty, batchNumber,
    note:'Penerimaan fisik', sjRef: s.no
  });
  toast(`Batch ${batchNumber} dari ${s.no}: ${fmt(qty)} ${prod(l.product).unit} di ${rack(rackId).code}.`, 'ok');
  closeModal(); render(); return false;
}

    body: `
      <div class="infobox">
        <div><span class="k">Surat Jalan</span><b>${s.no}</b></div>
        <div><span class="k">Pelanggan</span><b>${cust(s.customer).name}</b></div>

        <div><span class="k">Kode Produk</span><b>${p.code}</b></div>
        <div><span class="k">Qty Pending</span><b style="color:#b45309">${fmt(pendingOf(l))}</b></div>
        <div><span class="k">Stok titipan</span><b>Tidak berubah</b></div>
      </div>
      <form onsubmit="return submitWait(event,'${s.no}','${l.id}')">
        <div class="field"><label>Alasan belum ada</label>
          <select id="wtAlasan">
            ${Object.keys(ALASAN).map(k => `<option value="${k}">${ALASAN[k]}</option>`).join('')}
          </select></div>
        <div class="grid2">
          <div class="field"><label>Estimasi ready</label>
            <input id="wtEta" type="date" value="${l.eta || TODAY}"></div>
          <div class="field"><label>PIC</label>
            <input id="wtPic" type="text" value="${l.pic || ''}" required></div>
        </div>
      </form>`,
    footer: `
      <button class="btn" onclick="closeModal()">Batal</button>
      <button class="btn btn-warn" onclick="submitWait(null,'${s.no}','${l.id}')">Simpan ke Pending</button>`
  });
}
function submitWait(ev, sjNo, lineId){
  if (ev) ev.preventDefault();
  const { s, l } = findLine(sjNo, lineId);
  l.decision = 'WAITING'; l.alasan = $('wtAlasan').value;
  l.eta = $('wtEta').value; l.pic = $('wtPic').value;
  toast(`${s.no} dipindahkan ke pending.`, 'warn');
  closeModal(); render(); return false;
}
function openCancel(sjNo, lineId){
  const { s, l } = findLine(sjNo, lineId);
  if (!s || !l) return;
  const pending = pendingOf(l);
  openModal({
    title: 'Batalkan Sisa Pending',
    sub: 'Hanya untuk barang yang dipastikan tidak akan datang',
    body: `
      <div class="callout callout-amber" style="margin-bottom:16px">
        <div>⚠️</div>
        <div>Membatalkan <b>${fmt(pending)} ${prod(l.product).unit}</b> dari <b>${s.no}</b>. Selisih ini wajib dicatat di rekonsiliasi.</div>
      </div>
      <form onsubmit="return submitCancel(event,'${s.no}','${l.id}')">
        <div class="field"><label>Alasan</label>
          <select id="cnReason">
            <option value="BATAL_PELANGGAN">Dibatalkan pelanggan</option>
            <option value="BARANG_TIDAK_DATANG">Barang tidak akan datang</option>
            <option value="SALAH_INPUT">Salah input surat jalan</option>
            <option value="LAINNYA">Lainnya</option>
          </select></div>
        <div class="field"><label>Catatan</label>
          <textarea id="cnNote" placeholder="Keterangan…"></textarea></div>
      </form>`,
    footer: `
      <button class="btn" onclick="closeModal()">Batal</button>
      <button class="btn btn-danger" onclick="submitCancel(null,'${s.no}','${l.id}')">Ya, Batalkan</button>`
  });
}
function submitCancel(ev, sjNo, lineId){
  if (ev) ev.preventDefault();
  const { s, l } = findLine(sjNo, lineId);
  const pending = pendingOf(l);
  l.qtyCancelled += pending; l.decision = 'DONE';
  toast(`${fmt(pending)} unit dari ${s.no} dibatalkan.`, 'warn');
  closeModal(); render(); return false;
}

/* =========================================================
   21. MODAL: BUAT PENGIRIMAN
   ========================================================= */
function openShipment(){
  _shipDraft = { customer: db.customers[0]?.id || '', date: TODAY, driver:'', vehicle:'', note:'', lines:[] };
  updateShipModal();
}
function syncShipDraftFromDOM(){
  if ($('shDate'))    _shipDraft.date    = $('shDate').value || _shipDraft.date;
  if ($('shDriver'))  _shipDraft.driver  = $('shDriver').value;
  if ($('shVehicle')) _shipDraft.vehicle = $('shVehicle').value;
  if ($('shNote'))    _shipDraft.note    = $('shNote').value;
}
function updateShipModal(){
  const d = _shipDraft;
  const batches = getAvailableBatchesForCustomer(d.customer);
  const usedQty = {};
  d.lines.forEach(ln => { usedQty[ln.batchId] = (usedQty[ln.batchId] || 0) + ln.qty; });
  const availableBatches = batches.filter(b => (b.qtyAvail - (usedQty[b.id] || 0)) > 0);
  const batchOpts = availableBatches.length ? availableBatches.map(b => {
    const avail = b.qtyAvail - (usedQty[b.id] || 0);
    const p = prod(b.product);
    return `<option value="${b.id}">${b.batchNumber} • ${b.sjNo} • ${p.code} ${p.name} @ ${rack(b.rackId).code} — sisa ${fmt(avail)} ${p.unit}</option>`;
  }).join('') : '<option value="">— tidak ada stok tersedia —</option>';
  const lineRows = d.lines.length ? d.lines.map((ln, i) => {
    const p = prod(ln.product);
    return `<tr>
      <td class="num">${i+1}</td>
      <td>${batchTag(ln.batchNumber)}</td>

function onShipCustomerChange(){
  const newCid = $('shCustomer').value;
  if (_shipDraft.customer !== newCid && _shipDraft.lines.length > 0) {
    if (!confirm('Ganti pelanggan akan menghapus baris yang sudah dipilih. Lanjutkan?')) {
      $('shCustomer').value = _shipDraft.customer;
      return;
    }
    _shipDraft.lines = [];
  }
  _shipDraft.customer = newCid; updateShipModal();
}
function addShipLine(){
  syncShipDraftFromDOM();
  const batchId = $('shBatchSel').value;
  const qty = parseInt($('shBatchQty').value, 10);
  if (!batchId) { toast('Pilih batch terlebih dahulu.', 'err'); return; }
  if (!qty || qty < 1) { toast('Qty minimal 1.', 'err'); return; }
  const b = getAvailableBatchesForCustomer(_shipDraft.customer).find(x => x.id === batchId);
  if (!b) { toast('Batch tidak ditemukan.', 'err'); return; }
  const used = _shipDraft.lines.filter(l => l.batchId === batchId).reduce((a,l) => a + l.qty, 0);
  if (used + qty > b.qtyAvail) { toast(`Qty melebihi stok tersedia (sisa ${fmt(b.qtyAvail - used)}).`, 'err'); return; }
  _shipDraft.lines.push({ batchId, sjNo: b.sjNo, batchNumber: b.batchNumber, product: b.product, rackId: b.rackId, qty });
  updateShipModal();
}
function removeShipLine(i){ syncShipDraftFromDOM(); _shipDraft.lines.splice(i, 1); updateShipModal(); }
function submitShipment(andPrint){
  syncShipDraftFromDOM();
  const d = _shipDraft;
  if (!d.lines.length) { toast('Belum ada baris pengiriman.', 'err'); return; }
  const seq = String(db.shipments.length + 1).padStart(3, '0');
  const no = 'DO-TTR-' + seq;
  const lines = d.lines.map(ln => ({
    product: ln.product, qty: ln.qty, rackId: ln.rackId,
    consumed: [{ batchId: ln.batchId, sjNo: ln.sjNo, batchNumber: ln.batchNumber, qty: ln.qty }]
  }));
  db.shipments.push({
    no, date: d.date, customer: d.customer, status: 'SHIPPED', pod: null,
    driver: d.driver, vehicle: d.vehicle, note: d.note, printCount: 0, lastPrintedAt: null, lines
  });
  d.lines.forEach(ln => movements.unshift({
    date: d.date, type:'CONSIGN_OUT', ref: no, product: ln.product,
    customer: d.customer, rackId: ln.rackId, qty: -ln.qty,
    batchNumber: ln.batchNumber, note: 'Pengiriman', sjRef: ln.sjNo
  }));
  toast(`Pengiriman ${no} dibuat: ${d.lines.length} baris, ${fmt(d.lines.reduce((a,l) => a+l.qty,0))} unit.`, 'ok');
  closeModal(); render();
  if (andPrint) setTimeout(() => printSuratJalan(no), 250);
}

    body: `<form onsubmit="return saveRack(event,'${id || ''}')">
      <div class="field"><label>Gudang</label>
        <select id="mrLoc">${db.locations.map(l => `<option value="${l.id}" ${r.locationId===l.id?'selected':''}>${l.name}</option>`).join('')}</select></div>
      <div class="grid2">
        <div class="field"><label>Kode Rak</label><input id="mrCode" type="text" value="${r.code}" placeholder="A-01-01" required></div>
        <div class="field"><label>Nama Rak</label><input id="mrName" type="text" value="${r.name}" required></div>
      </div>
    </form>`,
    footer: `<button class="btn" onclick="closeModal()">Batal</button>
      <button class="btn btn-primary" onclick="saveRack(null,'${id || ''}')">Simpan</button>`
  });
}
function saveRack(ev, id){
  if (ev) ev.preventDefault();
  const code = $('mrCode').value.trim().toUpperCase(), name = $('mrName').value.trim(), locationId = $('mrLoc').value;
  if (!code || !name) { toast('Semua field wajib.', 'err'); return false; }
  if (db.racks.find(r => r.code === code && r.id !== id)) { toast('Kode rak sudah dipakai.', 'err'); return false; }
  if (id) { Object.assign(db.racks.find(r => r.id === id), { code, name, locationId }); toast('Rak diperbarui.', 'ok'); }
  else { db.racks.push({ id:'R' + (db.racks.length + 1 + Date.now() % 1000), code, name, locationId }); toast('Rak ditambahkan.', 'ok'); }
  closeModal(); render(); return false;
}
function delRack(id){
  const used = db.sj.some(s => s.lines.some(l => (l.receipts || []).some(r => r.rackId === id)));
  if (used) { toast('Rak dipakai di penerimaan.', 'err'); return; }
  if (db.shipments.some(sh => sh.lines.some(l => l.rackId === id))) { toast('Rak dipakai di pengiriman.', 'err'); return; }
  if (!confirm('Hapus rak?')) return;
  db.racks = db.racks.filter(r => r.id !== id); toast('Rak dihapus.', 'warn'); render();
}

/* =========================================================
   24. TOAST & INIT
   ========================================================= */
function toast(msg, type){
  const el = document.createElement('div');
  el.className = 'toast ' + (type || '');
  el.textContent = msg;
  $('toastRoot').appendChild(el);
  setTimeout(() => {
    el.style.transition = 'opacity .3s, transform .3s';
    el.style.opacity = '0'; el.style.transform = 'translateX(20px)';
    setTimeout(() => el.remove(), 320);
  }, 3600);
}

initConsumption();
initMovements();
render();
</script>
</body>
